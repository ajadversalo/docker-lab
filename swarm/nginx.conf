worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    upstream web_hosts {
        least_conn;
        server vm2:80 max_fails=1 fail_timeout=3s;
        server vm3:80 max_fails=1 fail_timeout=3s;
    }

    upstream api_hosts {
        least_conn;
        server vm2:8080 max_fails=1 fail_timeout=3s;
        server vm3:8080 max_fails=1 fail_timeout=3s;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://web_hosts;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 8080;
        location / {
            proxy_pass http://api_hosts;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
        }
    }
}
