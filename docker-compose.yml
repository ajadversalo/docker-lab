# Local Compose on Windows. Optional. Do not run this while vm1/vm2/vm3 are up.
name: docker-lab

services:
  api1:
    build: ./Api1
    image: docker-lab-api
    container_name: api1
    ports:
      - "8080:8080"
    environment:
      INSTANCE: api1

  api2:
    build: ./Api1
    image: docker-lab-api
    container_name: api2
    ports:
      - "8081:8080"
    environment:
      INSTANCE: api2

  web1:
    build: ./Web1
    image: docker-lab-web
    container_name: web1
    ports:
      - "3000:3000"
    environment:
      SITE_NAME: Web1
      API_URL: http://api1:8080
    depends_on:
      - api1

  web2:
    build: ./Web1
    image: docker-lab-web
    container_name: web2
    ports:
      - "3001:3000"
    environment:
      SITE_NAME: Web2
      API_URL: http://api2:8080
    depends_on:
      - api2

  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - web1
      - web2
